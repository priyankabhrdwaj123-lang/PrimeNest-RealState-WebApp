<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorite Properties | PrimeNest</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <div id="navbar"></div>

    <main>

        <section class="listing-hero">

            <div class="container listing-hero-content">

                <span class="section-label">
                    YOUR COLLECTION
                </span>

                <h1>
                    Favorite <span>Properties</span>
                </h1>

                <p>
                    Keep track of the properties you are interested in.
                </p>

            </div>

        </section>


        <section class="listing-section">

            <div class="container">

                <div id="favoritesGrid" class="property-grid"></div>

            </div>

        </section>

    </main>


    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const grid =
                document.getElementById("favoritesGrid");

            const favoriteIds =
                getFavorites();

            const favoriteProperties =
                properties.filter(property =>
                    favoriteIds.includes(property.id)
                );


            if (!favoriteProperties.length) {

                grid.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    ♡
                </div>

                <h3>
                    No Favorite Properties
                </h3>

                <p>
                    Add properties to your favorites
                    and they will appear here.
                </p>

                <a
                    href="properties.html"
                    class="btn btn-primary"
                >
                    Explore Properties
                </a>

            </div>

        `;

                return;
            }


            grid.innerHTML =
                favoriteProperties
                    .map(property => propertyCard(property))
                    .join("");


            bindDynamicButtons();

        });

    </script>

</body>

</html>
